steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--build-arg'
      - 'HF_TOKEN=${_HF_TOKEN}'
      - '-t'
      - '${_IMAGE}'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_IMAGE}']

images:
  - '${_IMAGE}'

options:
  machineType: 'E2_HIGHCPU_8'
  diskSizeGb: 100

timeout: '1800s'

substitutions:
  _IMAGE: 'us-central1-docker.pkg.dev/YOUR_PROJECT/cloud-run-images/sam3-annotator:latest'
  _HF_TOKEN: ''
