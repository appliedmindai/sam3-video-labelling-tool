server {
    listen 8080 http2 default_server;
    server_name _;
    client_max_body_size 2G;

    # Hashed bundles are content-addressed — cache forever.
    location /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html must revalidate on every load, otherwise browsers keep a
    # heuristically-cached copy and run a stale bundle after a deploy.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5555;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 60s;
        proxy_buffering off;       # SSE streaming
        proxy_request_buffering off;  # Stream uploads directly to Flask
    }
}
